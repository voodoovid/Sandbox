<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Map Test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--y:#f4b942;--ok:#3ecf8e;--bad:#ff5d6c;--wait:#8aa0bf;--card:rgba(10,18,34,.92);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07101f;color:#fff;font:600 15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);gap:12px}
header{display:flex;align-items:center;gap:12px;flex:none}
header img{width:34px;height:34px;border-radius:9px}
h1{font-size:24px;font-weight:800;letter-spacing:-.2px}
h1 i{font-style:normal;color:var(--y)}
.ver{margin-left:auto;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
main{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr;gap:12px}
@media (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.tests{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.t{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.dot{flex:none;width:34px;height:22px;border-radius:999px;font-size:10.5px;font-weight:800;display:grid;place-items:center;background:var(--wait);color:#07101f}
.t.pass .dot{background:var(--ok)}.t.fail .dot{background:var(--bad);color:#fff}
.t b{display:block;font-size:14px}
.t span{display:block;font-size:12px;font-weight:600;color:#c9dcf5;margin-top:2px;word-break:break-word}
.sum{margin-top:auto;padding:10px;border-radius:14px;text-align:center;font-weight:800;font-size:16px;background:rgba(255,255,255,.08)}
.sum.pass{background:rgba(62,207,142,.2);color:var(--ok)}.sum.fail{background:rgba(255,93,108,.2);color:var(--bad)}
.mapwrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);min-height:300px}
#map{position:absolute;inset:0;background:#0b1220}
.pill{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(10,18,34,.82);color:#fff;font-weight:800;font-size:13px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pill.on{background:var(--y);color:#07101f;border-color:var(--y)}
.top{position:absolute;top:12px;left:12px;right:12px;z-index:500;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.top .sp{flex:1}
.leg{padding:6px 8px;border-radius:12px;background:rgba(10,18,34,.86);border:1px solid var(--line);max-width:46%}
.leg b{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#bfe3ff;margin-bottom:4px}
.leg img{display:block;max-height:150px;max-width:100%;background:#fff;border-radius:6px}
.ctl{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ctl button{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
.ctl input{flex:1;accent-color:var(--y)}
.ctl .tm{flex:none;width:170px;text-align:right;line-height:1.15;white-space:nowrap}
.ctl .tm b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.ctl .tm span{font-size:12px;color:#bfe3ff}
.leaflet-rad-pane>.leaflet-layer{transition:opacity .45s ease-out}
.hint{position:fixed;z-index:999;pointer-events:none;padding:6px 10px;border-radius:10px;font-size:12.5px;background:rgba(10,18,34,.96);border:1px solid var(--line);opacity:0;transition:opacity .15s}
#map .leaflet-control-attribution{font-size:10px;background:rgba(10,18,34,.75);color:#bfe3ff}
#map .leaflet-control-attribution a{color:#bfe3ff}
#map .leaflet-bottom{bottom:78px}
</style>
</head>
<body>
<header>
  <img src="apple-touch-icon.png" alt="">
  <h1>Map <i>Test</i> — satellite map, rain &amp; snow types</h1>
  <span class="ver">Sandbox Map Test v0.98</span>
</header>
<main>
  <section class="tests" id="tests"></section>
  <section class="mapwrap">
    <div id="map"></div>
    <div class="top">
      <button class="pill on" id="mType" data-hint="Colour by rain, snow or mixed">Rain / Snow type</button>
      <button class="pill" id="mRate" data-hint="Colour by how hard it is falling">Rain rate</button>
      <span class="sp"></span>
      <div class="leg" id="leg"><b>Colour key</b><img id="legImg" alt=""></div>
    </div>
    <div class="ctl">
      <button id="play" data-hint="Play or pause the animation">❚❚</button>
      <input id="slide" type="range" min="0" max="0" value="0" data-hint="Drag to pick a time">
      <span class="tm" id="tm"><b>--</b><span></span></span>
    </div>
  </section>
</main>
<div class="hint" id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Sandbox Map Test v0.98 — proves a satellite base map, place labels and Environment Canada's precipitation-type radar
   (rain / snow / mixed) over 3 hours, before Whether (or not)'s Map gets a Tempest-style look */
const GEO='https://geo.weather.gc.ca/geomet';
const TYPE='Radar_1km_SfcPrecipType', RATE='RADAR_1KM_RRAI';
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const T=[
 ['lib','Map library','Leaflet map engine loads'],
 ['sat','Satellite map','Esri satellite imagery tiles'],
 ['lbl','Place names','Esri city and border labels'],
 ['typT','Rain/snow type times','Precipitation-type radar, last 3 hours'],
 ['typI','Rain/snow type image','A type frame draws on the map'],
 ['typL','Rain/snow type key','Colour key for rain, snow and mixed'],
 ['rteT','Rain rate times','Rain-rate radar, last 3 hours'],
 ['rteI','Rain rate image','A rain-rate frame draws on the map'],
 ['anim','Animation','All type frames ready to play']
];
const box=document.getElementById('tests');
T.forEach(([id,b,s])=>box.insertAdjacentHTML('beforeend',`<div class="t" id="t-${id}"><span class="dot">…</span><div><b>${b}</b><span>${s}</span></div></div>`));
box.insertAdjacentHTML('beforeend','<div class="sum" id="sum">Testing…</div>');
const res={};
function mark(id,ok,msg){ if(res[id]===true) return; res[id]=ok; const e=document.getElementById('t-'+id); e.className='t '+(ok?'pass':'fail'); e.querySelector('.dot').textContent=ok?'PASS':'FAIL'; if(msg) e.querySelector('span:last-child').textContent=msg; summary() }
function summary(){ const s=document.getElementById('sum'); const n=Object.keys(res).length, bad=Object.values(res).filter(v=>!v).length;
  if(bad){s.className='sum fail';s.textContent=bad+' test'+(bad>1?'s':'')+' failed'} else if(n===T.length){s.className='sum pass';s.textContent='All tests passed'} else {s.className='sum';s.textContent='Testing… '+n+' of '+T.length} }
const fmtT=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fmtD=d=>d.toLocaleDateString([],{month:'short',day:'numeric'})+' at '+fmtT(d);

const hint=document.getElementById('hint');
document.addEventListener('pointerover',e=>{const b=e.target.closest('[data-hint]'); if(!b){hint.style.opacity=0;return} const r=b.getBoundingClientRect(); hint.textContent=b.dataset.hint; hint.style.left=Math.max(8,Math.min(innerWidth-220,r.left))+'px'; hint.style.top=(r.top>50?r.top-36:r.bottom+8)+'px'; hint.style.opacity=1});

if(!window.L){ mark('lib',false,'Leaflet did not load from cdnjs.cloudflare.com'); throw new Error('no leaflet') }
mark('lib',true,'Leaflet '+L.version+' loaded');

const map=L.map('map',{zoomControl:false,zoomSnap:.5}).setView([49.25,-123.1],8);
map.attributionControl.setPrefix(false);
const sat=L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:13,attribution:'Imagery © Esri · Radar: Environment Canada'}).addTo(map);
sat.once('tileload',()=>mark('sat',true,'Satellite tiles loading'));
sat.on('tileerror',()=>{ if(!res.sat) mark('sat',false,'Satellite tiles were refused') });
map.createPane('lbl').style.zIndex=450; map.getPane('lbl').style.pointerEvents='none';
const lbl=L.tileLayer(ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:13,pane:'lbl'}).addTo(map);
lbl.once('tileload',()=>mark('lbl',true,'Labels loading'));
lbl.on('tileerror',()=>{ if(!res.lbl) mark('lbl',false,'Label tiles were refused') });
map.createPane('rad').style.zIndex=350; map.getPane('rad').style.pointerEvents='none';
const soft=()=>{ const mpp=156543.03*Math.cos(map.getCenter().lat*Math.PI/180)/Math.pow(2,map.getZoom()), cell=1000/mpp;
  map.getPane('rad').style.filter=`blur(${Math.min(9,Math.max(0,cell*.55)).toFixed(1)}px)` };
map.on('zoomend',soft); soft();
map.getPane('rad').style.opacity=.8;

async function times(layer,keepMin){
  const r=await fetch(`${GEO}?service=WMS&version=1.3.0&request=GetCapabilities&layer=${layer}&LAYERS_REFRESH_RATE=PT1M`,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const x=new DOMParser().parseFromString(await r.text(),'text/xml');
  const d=[...x.getElementsByTagName('Dimension')].find(n=>n.getAttribute('name')==='time');
  if(!d) throw new Error('no time dimension');
  const v=d.textContent.trim(); let out=[];
  if(v.includes('/')){ const [a,b,p]=v.split('/'); const step=(+(p.match(/(\d+)M/)||[0,10])[1])*60000; for(let t=+new Date(b); t>=+new Date(a) && out.length<200; t-=step) out.unshift(new Date(t)) }
  else out=v.split(',').map(s=>new Date(s));
  const cut=Date.now()-keepMin*60000; return out.filter(t=>+t>=cut);
}
const wms=(layer,t)=>L.tileLayer.wms(GEO,{pane:'rad',layers:layer,format:'image/png',transparent:true,version:'1.3.0',time:t.toISOString().replace('.000',''),tileSize:512,zoomOffset:-1,opacity:0,attribution:''});
const legURL=l=>`${GEO}?service=WMS&version=1.3.0&request=GetLegendGraphic&sld_version=1.1.0&format=image/png&layer=${l}`;

let mode='type', sets={type:[],rate:[]}, idx=0, timer=0, z=1;
function frames(){ return sets[mode] }
function show(i,fade){ const F=frames(); if(!F.length) return; const p=F[idx], f=F[i];
  if(p&&p!==f){ clearTimeout(p.off); p.off=setTimeout(()=>{ if(frames()[idx]!==p) p.l.setOpacity(0) },fade?520:0) }
  clearTimeout(f.off); f.l.setZIndex(++z); const el=f.l.getContainer(); if(el) el.style.transitionDuration=fade?'':'0s'; f.l.setOpacity(1);
  idx=i; document.getElementById('slide').value=i;
  const ago=Math.round((Date.now()-f.t)/60000);
  document.getElementById('tm').innerHTML=`<b>${fmtD(f.t)}</b><span>${ago<=1?'Just now':ago+' min ago'}</span>` }
function step(){ show((idx+1)%frames().length,true); timer=setTimeout(step,550) }
function play(on){ clearTimeout(timer); timer=0; document.getElementById('play').textContent=on?'❚❚':'▶'; if(on&&frames().length) timer=setTimeout(step,550) }
function setMode(m){ Object.values(sets).flat().forEach(f=>f.l.setOpacity(0)); mode=m;
  document.getElementById('mType').classList.toggle('on',m==='type'); document.getElementById('mRate').classList.toggle('on',m==='rate');
  document.getElementById('legImg').src=legURL(m==='type'?TYPE:RATE);
  const F=frames(); document.getElementById('slide').max=Math.max(0,F.length-1); idx=Math.max(0,F.length-1); show(idx); play(true) }

async function prep(key,layer,tId,iId){
  let ts=[];
  try{ ts=await times(layer,180); if(!ts.length) throw new Error('list empty'); mark(tId,true,ts.length+' frames, '+fmtT(ts[0])+' – '+fmtT(ts[ts.length-1])) }
  catch(e){ mark(tId,false,'Could not read times ('+e.message+')'); mark(iId,false,'Skipped: no times'); return }
  sets[key]=ts.map(t=>({t,l:wms(layer,t)}));
  const last=sets[key][sets[key].length-1].l;
  last.once('tileload',()=>mark(iId,true,'Drawing on the map'));
  last.on('tileerror',()=>{ if(!res[iId]) mark(iId,false,'Image request was refused') });
  sets[key].forEach(f=>f.l.addTo(map));
}
(async()=>{
  const li=new Image(); li.onload=()=>mark('typL',true,'Key loaded (shown top right)'); li.onerror=()=>mark('typL',false,'Colour key was refused'); li.src=legURL(TYPE);
  await Promise.all([prep('type',TYPE,'typT','typI'),prep('rate',RATE,'rteT','rteI')]);
  const F=sets.type; if(!F.length){ mark('anim',false,'Skipped: no type frames'); setMode('rate'); return }
  let n=0, bad=0; const fin=()=>{ if(n+bad===F.length) bad>F.length*.2?mark('anim',false,bad+' of '+F.length+' frames failed'):mark('anim',true,F.length+' frames loaded over 3 hours') };
  F.forEach(f=>{ f.l.once('load',()=>{n++;fin()}); });
  setTimeout(()=>{ if(res.anim===undefined){ bad=F.length-n; fin() } },20000);
  setMode('type');
})();
document.getElementById('play').onclick=()=>play(!timer);
document.getElementById('slide').oninput=e=>{ play(false); show(+e.target.value) };
document.getElementById('mType').onclick=()=>setMode('type');
document.getElementById('mRate').onclick=()=>setMode('rate');
</script>
</body>
</html>
