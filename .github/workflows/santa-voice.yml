name: Santa voice

on:
  push:
    paths:
      - "santa/greeting.txt"
      - ".github/scripts/santa_voice.py"
      - ".github/workflows/santa-voice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q espeak-ng ffmpeg
          pip install -q "kokoro>=0.9" soundfile "misaki[en]"
      - name: Make greetings
        run: python .github/scripts/santa_voice.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add santa/out
          git diff --cached --quiet || git commit -m "Santa greeting audio"
          git push
